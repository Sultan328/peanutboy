app = "replace-with-your-unique-peanutbot-name"
primary_region = "iad"
[env]
  PORT = "3000"
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
[mounts]
  source = "peanutbot_auth"
  destination = "/app/.auth"
